version: 2

# Dependencies are pinned (`~=` in requirements.txt, a lockfile for npm), so
# updates arrive as PRs that must pass .github/workflows/checks.yml instead of
# landing silently on the next production rebuild.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR for the Next/React set; they're released in lockstep and are
      # painful to review or roll back piecemeal.
      next:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "eslint-config-next"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
