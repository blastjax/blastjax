name: Checks

# Reusable: runs on every PR, and is called by the deploy workflow so nothing
# reaches EC2 without type-checking, linting and building cleanly first.
on:
  pull_request:
  workflow_call: {}

jobs:
  web:
    name: web (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    name: backend (compile, import)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      # Builds the app the same way uvicorn does, so a broken import or a
      # router that fails to register is caught here rather than on the host.
      # create_app() doesn't run lifespan, so no DB or Redis is needed.
      - name: Build the FastAPI app
        run: python -c "from app.factory import create_app; create_app()"
