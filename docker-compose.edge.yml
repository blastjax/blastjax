# Production overlay for the Lightsail host, where this stack sits behind the
# shared edge proxy (docker/edge/) alongside the portfolio-film and icrc sites
# instead of running a Caddy of its own. The deploy workflow runs:
#
#   docker compose -f docker-compose.yml -f docker-compose.edge.yml ...
#
# A plain `docker compose up` (local dev, or a host running only this stack)
# never reads this file and keeps the standalone caddy service.
services:
  api:
    networks:
      edge:
        aliases: [blastjax-api]
  web:
    networks:
      edge:
        aliases: [blastjax-web]
  # The edge proxy owns ports 80/443 on the host, so this stack's own Caddy
  # must not start there. A profile nothing enables keeps it from ever starting.
  caddy:
    profiles: [standalone]

networks:
  edge:
    external: true
