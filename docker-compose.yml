services:
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
      start_interval: 1s
  api:
    restart: always
    image: ${API_IMAGE:-blastjax-api}:latest
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    user: "${API_UID:-1000}:${API_GID:-1000}"
    networks:
      default:
        aliases: [blastjax-api]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set to the Neon Postgres URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-86400}
      BUDGET_CORS_ORIGINS: ${BUDGET_CORS_ORIGINS:-}
      BUDGET_SESSION_TTL_SECONDS: ${BUDGET_SESSION_TTL_SECONDS:-43200}
      BUDGET_DB_POOL_KEEP: ${BUDGET_DB_POOL_KEEP:-6}
      BUDGET_DB_POOL_MAX: ${BUDGET_DB_POOL_MAX:-10}
      BUDGET_DB_PROBE_AFTER_SECONDS: ${BUDGET_DB_PROBE_AFTER_SECONDS:-20}
      BUDGET_DB_IDLE_CLOSE_SECONDS: ${BUDGET_DB_IDLE_CLOSE_SECONDS:-120}
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s
  web:
    restart: always
    image: ${WEB_IMAGE:-blastjax-web}:latest
    build:
      context: ./web
      dockerfile: ../docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    networks:
      default:
        aliases: [blastjax-web]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s
  caddy:
    restart: always
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  redisdata:
  caddy_data:
  caddy_config:
