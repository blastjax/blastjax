name: edge

services:
  caddy:
    image: caddy:2-alpine
    container_name: edge-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${EDGE_DIR:-/srv/edge}/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

networks:
  edge:
    external: true

volumes:
  caddy_data:
  caddy_config:
